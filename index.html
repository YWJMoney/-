<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>자동 장부</title>
    <meta name="description" content="카드 문자를 붙여넣으면 장부가 되고, 구독·고정비·카드 결제일을 미리 알려주는 무광고 가계부" />
    <meta name="theme-color" content="#2f6fed" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="자동 장부" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // 테마·글자 크기를 그리기 전에 적용해 깜빡임을 막는다.
      try {
        const s = JSON.parse(localStorage.getItem('jangbu.v1') || '{}').settings || {};
        if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
        if (s.largeText) document.documentElement.dataset.large = '1';
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1 id="title">자동 장부</h1>
        <div class="sub" id="subtitle"></div>
      </div>
    </header>
    <main id="view" aria-live="polite"></main>

    <button class="fab" data-action="open-add" aria-label="기록 추가">+</button>

    <nav class="tabbar" aria-label="메뉴">
      <button data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>홈
      </button>
      <button data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>내역
      </button>
      <button data-tab="upcoming">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>곧 나갈 돈
      </button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정
      </button>
    </nav>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="x" data-action="close-sheet" aria-label="닫기">×</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </dialog>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
