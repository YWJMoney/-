name: Android (밤낮)
on:
  push:
    branches: [main]
    paths: ["shift-calendar-app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["shift-calendar-app/**", ".github/workflows/android.yml"]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: shift-calendar-app/server/share-worker
      - run: npm test
        working-directory: shift-calendar-app/server/company-worker
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/check_tracker.py
      - run: sh ./gradlew -p core test
      - run: sh ./gradlew :app:testDebugUnitTest :app:lintDebug --continue
      # Room writes the schema of each database version it builds. A new version has to be committed with its migration.
      - name: Room schema committed
        run: |
          changed=$(git ls-files --others --modified --exclude-standard app/schemas)
          for f in $changed; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
          test -z "$changed" || { echo "Commit these schema files: $changed"; exit 1; }
      # The share server checks the payloads the app tests just wrote (app/build/share-payload*.json).
      - run: npm test
        working-directory: shift-calendar-app/server/share-worker
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports
          path: |
            shift-calendar-app/app/build/test-results/testDebugUnitTest
            shift-calendar-app/app/build/reports
            shift-calendar-app/app/build/screenshots
            shift-calendar-app/core/build/reports
          retention-days: 7
