name: Release build (밤낮, unsigned)
# Builds the release AAB and APK, and the watch app's AAB (:wear, uploaded to the same Play app), without the upload key. The key never leaves the release manager's machine,
# where these files are signed with jarsigner (AAB) and apksigner (APK) before the Play upload.
on:
  push:
    branches: ["claude/release-**"]
    paths: ["shift-calendar-app/**", ".github/workflows/release-build.yml"]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew :app:bundleRelease :app:assembleRelease :wear:bundleRelease
      # 16 KB page alignment of native libraries, required for API 35+ on Play.
      - run: |
          za=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          "$za" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk > /dev/null
          echo "16 KB aligned"
          # apksigner travels with the files so the APK can be signed where the key is, without an Android SDK.
          cp "$(dirname "$za")/lib/apksigner.jar" app/build/outputs/apk/release/
      # [PERF-04] Sizes and their largest parts in the job summary; a file over its budget fails the build.
      - name: Size
        run: |
          python3 tools/app_size.py app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab wear/build/outputs/bundle/release/wear-release.aab \
            --json app/build/outputs/size.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-unsigned
          path: |
            shift-calendar-app/app/build/outputs/bundle/release/app-release.aab
            shift-calendar-app/app/build/outputs/apk/release/app-release-unsigned.apk
            shift-calendar-app/app/build/outputs/apk/release/apksigner.jar
            shift-calendar-app/app/build/outputs/mapping/release/mapping.txt
            shift-calendar-app/wear/build/outputs/bundle/release/wear-release.aab
            shift-calendar-app/wear/build/outputs/mapping/release/mapping.txt
            shift-calendar-app/app/build/outputs/size.json
          if-no-files-found: error
          retention-days: 14
