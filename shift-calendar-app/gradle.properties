org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# [QA-05] Builds :app, :database and :wear side by side when they do not depend on each other.
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# [MKT-09] Read-only schedule link server (server/share-worker on Cloudflare Workers, live since 1.8.0).
# Blank builds an offline app with no internet permission and no '링크로 보내기'.
bamnat.shareBaseUrl=https://bamnat-share.yoj0790.workers.dev
# [COMM-04][ADMIN-02] Company rules server (server/company-worker, live since 2026-10-18): 회사 찾기, sending
# setups and 설정 > 문의하기. Blank builds an app with no 회사 찾기, company files travel by hand and
# 문의하기 opens a mail app.
bamnat.companyBaseUrl=https://bamnat-company.yoj0790.workers.dev
# [REMOTE-01][REMOTE-02] Signed data files (요율·간이세액표·노임단가·프리셋) on GitHub Pages, remote/v1/ at the
# top of the repository, next to the privacy policy (결정 D3). Blank: the app keeps the files it shipped with.
bamnat.remoteBaseUrl=https://ywjmoney.github.io/-/
# [REL-09] The release number, set once here: the phone app uses it as is, the watch app (wear) adds 100000
# to versionCode so the two never clash on Play. Both share versionName.
bamnat.versionCode=34
bamnat.versionName=1.23.0
